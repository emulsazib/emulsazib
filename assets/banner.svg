<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">Emul Ahamed Sazib</title>
  <desc id="d">Banner: Full-Stack Developer, Embedded Systems, AI and Cybersecurity Engineer</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2C97DE"/>
    </pattern>

    <!-- fades the dot texture out behind the centred type -->
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.15" stop-color="#000"/>
      <stop offset="0.55" stop-color="#777"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="vignette">
      <rect width="1200" height="260" fill="url(#fade)"/>
    </mask>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C97DE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2C97DE" stop-opacity="1"/>
      <stop offset="1" stop-color="#2C97DE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)" opacity="0.16" mask="url(#vignette)"/>

  <!-- ================= EMBEDDED: PCB traces, left edge ================= -->
  <g fill="none" stroke="#2C97DE" stroke-width="2" stroke-linecap="round" opacity="0.38">
    <path d="M0 54 H72 l26 26 H182"/>
    <path d="M0 104 H48 l26 26 H150 l22 -22 H244"/>
    <path d="M0 156 H96 l26 -26 H168"/>
    <path d="M0 206 H60 l26 -26 H128 l22 22 H210"/>
    <path d="M122 130 v46 h58"/>
  </g>
  <g fill="#2C97DE" opacity="0.55">
    <circle cx="182" cy="80" r="4"/>
    <circle cx="244" cy="108" r="4"/>
    <circle cx="168" cy="130" r="4"/>
    <circle cx="210" cy="202" r="4"/>
    <circle cx="180" cy="176" r="4"/>
  </g>
  <!-- MCU die -->
  <g opacity="0.42">
    <rect x="52" y="96" width="56" height="56" rx="5" fill="none" stroke="#2C97DE" stroke-width="2"/>
    <rect x="68" y="112" width="24" height="24" rx="2" fill="#2C97DE" opacity="0.5"/>
    <g stroke="#2C97DE" stroke-width="2" stroke-linecap="round">
      <path d="M64 96 V86 M80 96 V86 M96 96 V86"/>
      <path d="M64 152 V162 M80 152 V162 M96 152 V162"/>
    </g>
  </g>

  <!-- ================= SECURITY: shield, right edge ================= -->
  <g transform="translate(1012 74)" opacity="0.4">
    <path d="M56 0 L112 22 V64 C112 96 88 118 56 130 C24 118 0 96 0 64 V22 Z"
          fill="none" stroke="#2C97DE" stroke-width="2.5"/>
    <g stroke="#2C97DE" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <path d="M56 34 V56"/>
      <path d="M36 56 H76"/>
      <path d="M36 56 V78 M76 56 V78"/>
      <path d="M56 56 V96"/>
    </g>
    <circle cx="56" cy="34" r="3.5" fill="#2C97DE"/>
    <circle cx="36" cy="78" r="3.5" fill="#2C97DE"/>
    <circle cx="76" cy="78" r="3.5" fill="#2C97DE"/>
    <circle cx="56" cy="96" r="3.5" fill="#2C97DE"/>
  </g>
  <!-- traces feeding the shield -->
  <g fill="none" stroke="#2C97DE" stroke-width="2" stroke-linecap="round" opacity="0.32">
    <path d="M1200 60 H1160 l-24 24 H1124"/>
    <path d="M1200 130 H1148"/>
    <path d="M1200 200 H1158 l-24 -24 H1120"/>
  </g>

  <!-- ================= FULL-STACK: code windows, flanking the type ================= -->
  <g opacity="0.32">
    <rect x="318" y="28" width="164" height="56" rx="6" fill="none" stroke="#2C97DE" stroke-width="1.8"/>
    <path d="M318 46 H482" stroke="#2C97DE" stroke-width="1.8"/>
    <circle cx="331" cy="37" r="2.6" fill="#2C97DE"/>
    <circle cx="341" cy="37" r="2.6" fill="#2C97DE"/>
    <circle cx="351" cy="37" r="2.6" fill="#2C97DE"/>
    <g stroke="#2C97DE" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <path d="M330 58 H392"/>
      <path d="M340 70 H430"/>
    </g>
  </g>
  <g opacity="0.32">
    <rect x="718" y="28" width="164" height="56" rx="6" fill="none" stroke="#2C97DE" stroke-width="1.8"/>
    <path d="M718 46 H882" stroke="#2C97DE" stroke-width="1.8"/>
    <circle cx="731" cy="37" r="2.6" fill="#2C97DE"/>
    <circle cx="741" cy="37" r="2.6" fill="#2C97DE"/>
    <circle cx="751" cy="37" r="2.6" fill="#2C97DE"/>
    <g stroke="#2C97DE" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <path d="M730 58 H820"/>
      <path d="M740 70 H792"/>
    </g>
  </g>

  <!-- ================= TYPE ================= -->
  <text x="600" y="126" text-anchor="middle" fill="#ffffff"
        font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="6">EMUL AHAMED SAZIB</text>

  <rect x="424" y="148" width="352" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="182" text-anchor="middle" fill="#a8c0cc"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" letter-spacing="1.4">Full-Stack Developer &#8226; Embedded Systems &#8226; AI &amp; Cybersecurity</text>

  <text x="600" y="212" text-anchor="middle" fill="#2C97DE"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="1" opacity="0.9">I build where software meets hardware.</text>
</svg>
